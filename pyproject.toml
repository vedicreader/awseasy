[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awseasy"
dynamic = ["version"]
description = "AWS provisioning for enterprise GenAI stacks: Bedrock, Cognito SSO, CloudFront, and compliance-by-default"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "boto3>=1.35",
    "botocore>=1.35",
    "dockeasy>=0.0.5",
    "fastcore>=1.12.31",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "moto[all]>=5.0",
    "nbdev>=3.0.12",
    "notebook>=7.5.5",
]

[project.urls]
Repository = "https://github.com/vedicreader/awseasy"
Documentation = "https://vedicreader.github.io/awseasy/"

[project.entry-points.nbdev]
awseasy = "awseasy._modidx:d"

[tool.hatch.version]
path = "awseasy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["awseasy"]

[tool.nbdev]

[tool.hatch.build.targets.sdist]
include = [
    "/awseasy",
    "/README.md",
    "/pyproject.toml",
]

[dependency-groups]
dev = [
    "moto[all]>=5.0",
    "nbdev>=3.0.12",
    "notebook>=7.5.5",
]
